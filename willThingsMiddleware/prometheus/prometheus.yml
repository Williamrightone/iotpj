global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # Spring Boot 服務皆透過 host.docker.internal 存取（Docker Desktop on Windows/Mac）
  # 須在各服務的 application.yml 加上：
  #   management.endpoints.web.exposure.include: health,info,prometheus
  #   management.endpoint.prometheus.enabled: true

  - job_name: uaa-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8081']

  - job_name: iotcore-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8082']

  - job_name: telemetry-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8083']

  - job_name: iot-adapter
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8084']

  - job_name: saas-bff
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8090']

  - job_name: realtime-bff
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8091']
