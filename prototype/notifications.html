<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>willThx — 通知設定</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="sidebarMount"></div>
<div class="main">
  <header class="page-header">
    <div>
      <div class="page-title">通知設定</div>
      <div class="page-subtitle">系統設定 / 通知設定</div>
    </div>
  </header>
  <div class="page-body">

    <div class="grid-2" style="gap:20px;align-items:start;">

      <!-- Telegram Settings -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">Telegram 推播設定</span>
          <span class="badge badge-success" id="telegramStatus">已連線</span>
        </div>
        <div class="card-body">
          <div class="form-group">
            <label>Bot Token</label>
            <input id="botToken" type="text" value="1234567890:YOUR_BOT_TOKEN_HERE_FAKE_FAKE_FAKE" placeholder="從 @BotFather 取得">
          </div>
          <div class="form-group">
            <label>Channel / Group ID</label>
            <input id="channelId" type="text" value="-1001987654321" placeholder="-100xxxxxxxxxx">
          </div>
          <div class="form-group">
            <label>告警訊息格式</label>
            <select id="msgFormat">
              <option value="simple" selected>簡潔（一行摘要）</option>
              <option value="detail">詳細（含感測數值）</option>
            </select>
          </div>
          <div style="display:flex;gap:10px;margin-top:20px;">
            <button class="btn btn-primary" onclick="saveSettings()">儲存設定</button>
            <button class="btn btn-ghost" onclick="sendTest()">發送測試通知</button>
          </div>
          <div id="saveMsg" style="font-size:13px;margin-top:10px;color:var(--success);min-height:20px;"></div>
        </div>
      </div>

      <!-- Notify Rules Summary -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">已設定推播的告警規則</span>
          <a href="alert-rules.html" class="btn btn-ghost" style="padding:5px 12px;font-size:12px;">管理規則</a>
        </div>
        <div class="card-body" style="padding:0;">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>規則</th>
                  <th>嚴重度</th>
                  <th>啟用</th>
                </tr>
              </thead>
              <tbody>
                <!-- rendered by JS below -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>

    <!-- Notification Log -->
    <div class="card" style="margin-top:20px;">
      <div class="card-header">
        <span class="card-title">近期推播紀錄</span>
        <span style="font-size:12px;color:var(--text-muted);margin-left:8px;">最近 20 筆</span>
      </div>
      <div class="card-body">
        <div class="notif-log" id="notifLog"></div>
      </div>
    </div>

  </div>
</div>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById('sidebarMount').innerHTML = renderSidebar();
  initApp();

  // Replace placeholder with actual rules
  document.querySelector('tbody').innerHTML = MOCK_RULES
    .filter(r => r.notify.includes('telegram'))
    .map(r => `
      <tr>
        <td style="font-size:13px;">${r.component}</td>
        <td class="severity-${r.sev}">${r.sev==='high'?'● 高':'○ 低'}</td>
        <td>
          <label class="toggle">
            <input type="checkbox" ${r.active?'checked':''} disabled>
            <span class="toggle-slider"></span>
          </label>
        </td>
      </tr>
    `).join('') || '<tr><td colspan="3"><div class="empty-state">無 Telegram 推播規則</div></td></tr>';

  const LOG = [
    { ok:true,  time:'2026-08-07 13:47:12', msg:'[高] 回流區溫度超標 264.2°C → 回焊爐-01' },
    { ok:true,  time:'2026-08-07 13:31:05', msg:'[高] AOI 連續 3 片 fail（錫橋缺陷）→ AOI機-01' },
    { ok:false, time:'2026-08-07 12:55:30', msg:'[高] 印刷厚度低於下限 0.09mm → 印刷機-02（發送失敗：網路逾時）' },
    { ok:true,  time:'2026-08-07 10:12:44', msg:'[高] 鎖點扭力超標 2.1 N·m → 組裝台-01' },
    { ok:true,  time:'2026-08-07 08:03:17', msg:'[高] 回流區溫度超標 261.5°C → 回焊爐-01' },
  ];

  document.getElementById('notifLog').innerHTML = LOG.map(l => `
    <div class="notif-log-item ${l.ok ? 'notif-ok' : 'notif-fail'}">
      <div style="font-size:18px;line-height:1;">${l.ok ? '✓' : '✗'}</div>
      <div style="flex:1;">
        <div style="font-size:13px;">${l.msg}</div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">${l.time}</div>
      </div>
      <span class="badge ${l.ok ? 'badge-success' : 'badge-danger'}" style="font-size:11px;flex-shrink:0;">
        ${l.ok ? '成功' : '失敗'}
      </span>
    </div>
  `).join('');

  function saveSettings() {
    const msg = document.getElementById('saveMsg');
    msg.textContent = '設定已儲存';
    setTimeout(() => msg.textContent = '', 2500);
  }

  function sendTest() {
    const msg = document.getElementById('saveMsg');
    msg.style.color = 'var(--text-muted)';
    msg.textContent = '發送中...';
    setTimeout(() => {
      msg.style.color = 'var(--success)';
      msg.textContent = '測試通知發送成功！請查看 Telegram。';
      LOG.unshift({
        ok: true,
        time: new Date().toLocaleString('zh-TW',{hour12:false}).replace('/','-').replace('/','-'),
        msg: '[測試] willThx 通知測試訊息',
      });
      document.getElementById('notifLog').innerHTML = LOG.slice(0,20).map(l => `
        <div class="notif-log-item ${l.ok ? 'notif-ok' : 'notif-fail'}">
          <div style="font-size:18px;line-height:1;">${l.ok ? '✓' : '✗'}</div>
          <div style="flex:1;">
            <div style="font-size:13px;">${l.msg}</div>
            <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">${l.time}</div>
          </div>
          <span class="badge ${l.ok ? 'badge-success' : 'badge-danger'}" style="font-size:11px;flex-shrink:0;">${l.ok?'成功':'失敗'}</span>
        </div>
      `).join('');
      setTimeout(() => msg.textContent = '', 3000);
    }, 1200);
  }
</script>
</body>
</html>
