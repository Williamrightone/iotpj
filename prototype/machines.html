<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>willThx — 機台管理</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="sidebarMount"></div>
<div class="main">
  <header class="page-header">
    <div>
      <div class="page-title">機台管理</div>
      <div class="page-subtitle">製程配置 / 機台管理</div>
    </div>
    <div class="header-actions">
      <select id="stationFilter" style="padding:7px 12px;font-size:13px;" onchange="renderTable()">
        <option value="">所有站點</option>
      </select>
      <button class="btn btn-primary" data-write-action onclick="openAddMachine()">＋ 新增機台</button>
    </div>
  </header>
  <div class="page-body">
    <div class="card">
      <div class="card-body" style="padding:0;">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>機台代碼</th>
                <th>機台名稱</th>
                <th>所屬站點</th>
                <th>型號</th>
                <th>IoT 元件數</th>
                <th>狀態</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="machineTbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="modalMount"></div>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById('sidebarMount').innerHTML = renderSidebar();
  document.getElementById('modalMount').innerHTML = MODAL_HTML;
  initApp();

  const STATUS_BADGE = { running:'badge-success', error:'badge-danger', offline:'badge-neutral' };
  const STATUS_LABEL = { running:'運行中', error:'異常', offline:'離線' };

  // Populate station filter
  const sf = document.getElementById('stationFilter');
  MOCK_STATIONS.forEach(s => {
    const o = document.createElement('option');
    o.value = s.id; o.textContent = s.name;
    sf.appendChild(o);
  });

  // Pre-select from query string
  const params = new URLSearchParams(location.search);
  if (params.get('station')) sf.value = params.get('station');

  function allMachines() {
    return Object.entries(MOCK_MACHINES).flatMap(([sid, machines]) =>
      machines.map(m => ({ ...m, stationId: sid }))
    );
  }

  function stationName(id) {
    return (MOCK_STATIONS.find(s => s.id === id) || {}).name || id;
  }

  function renderTable() {
    const filter = document.getElementById('stationFilter').value;
    const list = allMachines().filter(m => !filter || m.stationId === filter);
    const user = getSession();
    document.getElementById('machineTbody').innerHTML = list.map(m => `
      <tr>
        <td><code style="font-size:12px;background:var(--bg);padding:2px 6px;border-radius:4px;">${m.id}</code></td>
        <td><strong>${m.name}</strong></td>
        <td>${stationName(m.stationId)}</td>
        <td style="color:var(--text-muted);font-size:13px;">${m.model}</td>
        <td>${m.iotCount}</td>
        <td><span class="badge ${STATUS_BADGE[m.status]}">${STATUS_LABEL[m.status]}</span></td>
        <td style="display:flex;gap:6px;">
          <button class="btn btn-ghost" style="padding:5px 12px;font-size:12px;" data-write-action onclick="openEditMachine('${m.id}','${m.stationId}')">編輯</button>
          <a href="iot-components.html?station=${m.stationId}&machine=${m.id}" class="btn btn-ghost" style="padding:5px 12px;font-size:12px;">IoT 元件</a>
          <button class="btn btn-ghost" style="padding:5px 12px;font-size:12px;color:var(--danger);" data-write-action onclick="deleteMachine('${m.id}','${m.stationId}')">刪除</button>
        </td>
      </tr>
    `).join('') || '<tr><td colspan="7" class="empty-state">此站點尚無機台</td></tr>';

    if (user && user.role !== 'Admin') {
      document.querySelectorAll('[data-write-action]').forEach(el => {
        el.style.opacity = '.4'; el.style.pointerEvents = 'none';
      });
    }
  }

  function machineForm(m = {}, sid = '') {
    const stationOptions = MOCK_STATIONS.map(s =>
      `<option value="${s.id}" ${(m.stationId||sid) === s.id ? 'selected' : ''}>${s.name}</option>`
    ).join('');
    return `
      <div class="form-group">
        <label>所屬站點</label>
        <select id="fStation">${stationOptions}</select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>機台代碼</label>
          <input id="fId" type="text" value="${m.id||''}" placeholder="M09" ${m.id ? 'readonly style="background:var(--bg)"' : ''}>
        </div>
        <div class="form-group">
          <label>機台名稱</label>
          <input id="fName" type="text" value="${m.name||''}" placeholder="印刷機-03">
        </div>
      </div>
      <div class="form-group">
        <label>型號</label>
        <input id="fModel" type="text" value="${m.model||''}" placeholder="DEK Horizon">
      </div>`;
  }

  function openAddMachine() {
    const sid = document.getElementById('stationFilter').value;
    openModal('新增機台', machineForm({}, sid), () => {
      const sid   = document.getElementById('fStation').value;
      const id    = document.getElementById('fId').value.trim();
      const name  = document.getElementById('fName').value.trim();
      const model = document.getElementById('fModel').value.trim();
      if (!id || !name) return alert('請填寫必填欄位');
      if (!MOCK_MACHINES[sid]) MOCK_MACHINES[sid] = [];
      MOCK_MACHINES[sid].push({ id, name, model, status:'running', iotCount:0 });
      renderTable(); closeModal();
    });
  }

  function openEditMachine(id, sid) {
    const m = MOCK_MACHINES[sid].find(x => x.id === id);
    m.stationId = sid;
    openModal('編輯機台', machineForm(m, sid), () => {
      m.name  = document.getElementById('fName').value.trim();
      m.model = document.getElementById('fModel').value.trim();
      renderTable(); closeModal();
    });
  }

  function deleteMachine(id, sid) {
    if (!confirm('確定刪除此機台？')) return;
    MOCK_MACHINES[sid] = MOCK_MACHINES[sid].filter(x => x.id !== id);
    renderTable();
  }

  renderTable();
</script>
</body>
</html>
