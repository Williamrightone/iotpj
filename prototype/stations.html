<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>willThx — 站點管理</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="sidebarMount"></div>
<div class="main">
  <header class="page-header">
    <div>
      <div class="page-title">站點管理</div>
      <div class="page-subtitle">製程配置 / 站點管理</div>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary" data-write-action onclick="openAddStation()">＋ 新增站點</button>
    </div>
  </header>
  <div class="page-body">
    <div class="card">
      <div class="card-body" style="padding:0;">
        <div class="table-wrap">
          <table id="stationTable">
            <thead>
              <tr>
                <th>站點代碼</th>
                <th>站點名稱</th>
                <th>順序</th>
                <th>機台數</th>
                <th>IoT 元件數</th>
                <th>狀態</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="stationTbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="modalMount"></div>

<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById('sidebarMount').innerHTML = renderSidebar();
  document.getElementById('modalMount').innerHTML = MODAL_HTML;
  initApp();

  const STATUS_LABEL = { running:'運行中', error:'異常', offline:'離線' };
  const STATUS_BADGE = { running:'badge-success', error:'badge-danger', offline:'badge-neutral' };

  function renderTable() {
    document.getElementById('stationTbody').innerHTML = MOCK_STATIONS.map(s => `
      <tr>
        <td><code style="font-size:12px;background:var(--bg);padding:2px 6px;border-radius:4px;">${s.id}</code></td>
        <td><strong>${s.name}</strong></td>
        <td>${s.order}</td>
        <td>${s.machineCount}</td>
        <td>${s.iotCount}</td>
        <td><span class="badge ${STATUS_BADGE[s.status]}">${STATUS_LABEL[s.status]}</span></td>
        <td style="display:flex;gap:6px;">
          <button class="btn btn-ghost" style="padding:5px 12px;font-size:12px;" data-write-action onclick="openEditStation('${s.id}')">編輯</button>
          <a href="machines.html?station=${s.id}" class="btn btn-ghost" style="padding:5px 12px;font-size:12px;">機台</a>
          <button class="btn btn-ghost" style="padding:5px 12px;font-size:12px;color:var(--danger);" data-write-action onclick="deleteStation('${s.id}')">刪除</button>
        </td>
      </tr>
    `).join('');
    // re-apply RBAC for dynamically rendered buttons
    const user = getSession();
    if (user && user.role !== 'Admin') {
      document.querySelectorAll('[data-write-action]').forEach(el => {
        el.style.opacity = '.4'; el.style.pointerEvents = 'none';
      });
    }
  }

  function stationForm(s = {}) {
    return `
      <div class="form-group">
        <label>站點代碼</label>
        <input id="fId" type="text" value="${s.id||''}" placeholder="S06" ${s.id ? 'readonly style="background:var(--bg)"' : ''}>
      </div>
      <div class="form-group">
        <label>站點名稱</label>
        <input id="fName" type="text" value="${s.name||''}" placeholder="e.g. 錫膏印刷">
      </div>
      <div class="form-group">
        <label>顯示順序</label>
        <input id="fOrder" type="number" value="${s.order||MOCK_STATIONS.length+1}" min="1">
      </div>`;
  }

  function openAddStation() {
    openModal('新增站點', stationForm(), () => {
      const id   = document.getElementById('fId').value.trim();
      const name = document.getElementById('fName').value.trim();
      const order = parseInt(document.getElementById('fOrder').value);
      if (!id || !name) return alert('請填寫必填欄位');
      MOCK_STATIONS.push({ id, name, order, machineCount:0, iotCount:0, status:'running' });
      MOCK_STATIONS.sort((a,b) => a.order - b.order);
      renderTable(); closeModal();
    });
  }

  function openEditStation(id) {
    const s = MOCK_STATIONS.find(x => x.id === id);
    openModal('編輯站點', stationForm(s), () => {
      s.name  = document.getElementById('fName').value.trim();
      s.order = parseInt(document.getElementById('fOrder').value);
      MOCK_STATIONS.sort((a,b) => a.order - b.order);
      renderTable(); closeModal();
    });
  }

  function deleteStation(id) {
    if (!confirm('確定刪除此站點？')) return;
    const i = MOCK_STATIONS.findIndex(x => x.id === id);
    if (i > -1) MOCK_STATIONS.splice(i, 1);
    renderTable();
  }

  renderTable();
</script>
</body>
</html>
