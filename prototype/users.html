<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>willThx — 使用者管理</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="sidebarMount"></div>
<div class="main">
  <header class="page-header">
    <div>
      <div class="page-title">使用者管理</div>
      <div class="page-subtitle">系統設定 / 使用者管理</div>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary" data-admin-only onclick="openAddUser()">＋ 新增使用者</button>
    </div>
  </header>
  <div class="page-body">
    <div class="card">
      <div class="card-body" style="padding:0;">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>姓名</th>
                <th>帳號</th>
                <th>角色</th>
                <th>最後登入</th>
                <th>狀態</th>
                <th data-admin-only>操作</th>
              </tr>
            </thead>
            <tbody id="userTbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="modalMount"></div>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById('sidebarMount').innerHTML = renderSidebar();
  document.getElementById('modalMount').innerHTML = MODAL_HTML;
  initApp();

  const ROLE_BADGE = { Admin:'badge-danger', Maintainer:'badge-info', Viewer:'badge-neutral' };

  function renderTable() {
    document.getElementById('userTbody').innerHTML = MOCK_USERS.map(u => `
      <tr>
        <td>
          <div style="display:flex;align-items:center;gap:10px;">
            <div class="user-avatar" style="width:32px;height:32px;font-size:13px;">${u.name[0]}</div>
            <strong>${u.name}</strong>
          </div>
        </td>
        <td style="font-family:monospace;font-size:13px;">${u.username}</td>
        <td><span class="badge ${ROLE_BADGE[u.role]}">${u.role}</span></td>
        <td style="font-size:12px;color:var(--text-muted);">${u.lastLogin}</td>
        <td>
          <label class="toggle">
            <input type="checkbox" ${u.active?'checked':''} onchange="toggleUser('${u.id}',this.checked)">
            <span class="toggle-slider"></span>
          </label>
        </td>
        <td data-admin-only>
          <button class="btn btn-ghost" style="padding:5px 12px;font-size:12px;" onclick="openEditUser('${u.id}')">編輯</button>
        </td>
      </tr>
    `).join('');
  }

  function toggleUser(id, active) {
    const u = MOCK_USERS.find(x => x.id === id);
    const me = getSession();
    if (u && u.username === me.username) {
      alert('不能停用自己的帳號');
      renderTable();
      return;
    }
    if (u) u.active = active;
  }

  function userForm(u = {}) {
    return `
      <div class="form-row">
        <div class="form-group">
          <label>帳號</label>
          <input id="fUsername" type="text" value="${u.username||''}" placeholder="loginname" ${u.id?'readonly style="background:var(--bg)"':''}>
        </div>
        <div class="form-group">
          <label>姓名</label>
          <input id="fName" type="text" value="${u.name||''}" placeholder="王小明">
        </div>
      </div>
      <div class="form-group">
        <label>角色</label>
        <select id="fRole">
          <option ${u.role==='Admin'?'selected':''}>Admin</option>
          <option ${u.role==='Maintainer'?'selected':''}>Maintainer</option>
          <option ${u.role==='Viewer'?'selected':''}>Viewer</option>
        </select>
      </div>
      ${!u.id ? `
      <div class="form-group">
        <label>初始密碼</label>
        <input id="fPassword" type="password" placeholder="至少 6 個字元">
      </div>` : `
      <div class="form-group" style="margin-top:8px;">
        <label>重設密碼（選填）</label>
        <input id="fPassword" type="password" placeholder="留空不更改">
      </div>`}
      <div class="form-group">
        <label>製程站點綁定（Maintainer / Viewer 適用，空白表示可看全部）</label>
        ${MOCK_STATIONS.length === 0
          ? `<div style="padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:13px;color:var(--text-muted);">
               目前尚無製程站點，請先至製程配置新增站點後再設定。
             </div>`
          : `<div style="display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;">
               ${MOCK_STATIONS.map(s => `
                 <label style="display:flex;align-items:center;gap:6px;font-weight:normal;cursor:pointer;">
                   <input type="checkbox" name="fStation" value="${s.id}"
                     ${(u.stations||[]).includes(s.id) ? 'checked' : ''}>
                   ${s.name}
                 </label>`).join('')}
             </div>`
        }
      </div>
    `;
  }

  function openAddUser() {
    openModal('新增使用者', userForm(), () => {
      const username = document.getElementById('fUsername').value.trim();
      const name     = document.getElementById('fName').value.trim();
      const role     = document.getElementById('fRole').value;
      const stations = [...document.querySelectorAll('input[name="fStation"]:checked')].map(el => el.value);
      if (!username || !name) return alert('請填寫必填欄位');
      MOCK_USERS.push({
        id: 'U' + (MOCK_USERS.length+1).toString().padStart(2,'0'),
        username, name, role, stations, lastLogin:'—', active:true,
      });
      renderTable(); closeModal();
    });
  }

  function openEditUser(id) {
    const u = MOCK_USERS.find(x => x.id === id);
    const me = getSession();
    openModal('編輯使用者', userForm(u), () => {
      const newRole = document.getElementById('fRole').value;
      if (u.username === me.username && newRole !== u.role) {
        return alert('不可修改自己的角色');
      }
      u.name     = document.getElementById('fName').value.trim();
      u.role     = newRole;
      u.stations = [...document.querySelectorAll('input[name="fStation"]:checked')].map(el => el.value);
      renderTable(); closeModal();
    });
  }

  renderTable();
</script>
</body>
</html>
