<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>willThx — 即時告警</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .alert-row { transition: background .2s; }
    .alert-row.new-alert { animation: flashIn .6s ease; }
    @keyframes flashIn {
      0%   { background: #fef9c3; }
      100% { background: transparent; }
    }
    .ack-chip {
      display:inline-flex;align-items:center;gap:4px;
      padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600;
      background:var(--success-light);color:#059669;
    }
  </style>
</head>
<body>
<div id="sidebarMount"></div>
<div class="main">
  <header class="page-header">
    <div>
      <div class="page-title">即時告警</div>
      <div class="page-subtitle">告警中心 / 即時告警</div>
    </div>
    <div class="header-actions">
      <span id="liveIndicator" style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--success);">
        <span style="width:8px;height:8px;border-radius:50%;background:var(--success);display:inline-block;animation:pulse 1.5s infinite;"></span>
        即時更新中
      </span>
    </div>
  </header>

  <style>
    @keyframes pulse {
      0%,100% { opacity:1; } 50% { opacity:.3; }
    }
  </style>

  <div class="page-body">
    <div class="filter-bar">
      <select id="fSeverity" onchange="renderAlerts()">
        <option value="">所有嚴重度</option>
        <option value="high">高</option>
        <option value="low">低</option>
      </select>
      <select id="fStation" onchange="renderAlerts()">
        <option value="">所有站點</option>
      </select>
      <select id="fStatus" onchange="renderAlerts()">
        <option value="">所有狀態</option>
        <option value="open">未處理</option>
        <option value="ack">已處理</option>
      </select>
    </div>

    <div class="card">
      <div class="card-body" style="padding:0;">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:80px;">嚴重度</th>
                <th style="width:130px;">時間</th>
                <th>告警訊息</th>
                <th>站點</th>
                <th>機台</th>
                <th>數值</th>
                <th style="width:120px;">狀態</th>
                <th style="width:100px;">操作</th>
              </tr>
            </thead>
            <tbody id="alertTbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="modalMount"></div>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById('sidebarMount').innerHTML = renderSidebar();
  document.getElementById('modalMount').innerHTML = MODAL_HTML;
  initApp();

  // Populate station filter
  const sf = document.getElementById('fStation');
  MOCK_STATIONS.forEach(s => {
    const o = document.createElement('option'); o.value=s.name; o.textContent=s.name; sf.appendChild(o);
  });

  let ALERTS = [
    { id:'A001', sev:'high', time:'2026-08-07 13:47:12', msg:'回流區溫度超標', station:'回流焊',   machine:'回焊爐-01', value:'264.2 °C（上限 260）', status:'open', ackBy:null, ackNote:'' },
    { id:'A002', sev:'high', time:'2026-08-07 13:31:05', msg:'AOI 連續 3 片 fail（錫橋缺陷）', station:'AOI 檢測', machine:'AOI機-01', value:'3 片連續', status:'open', ackBy:null, ackNote:'' },
    { id:'A003', sev:'low',  time:'2026-08-07 13:18:44', msg:'站區濕度偏高',  station:'廠務監控',  machine:'—',        value:'68% （上限 65%）', status:'ack',  ackBy:'李操作員', ackNote:'已通知廠務調整空調' },
    { id:'A004', sev:'high', time:'2026-08-07 12:55:30', msg:'印刷厚度低於下限', station:'錫膏印刷', machine:'印刷機-02', value:'0.09 mm（下限 0.10）', status:'ack', ackBy:'李操作員', ackNote:'已換錫膏批次' },
    { id:'A005', sev:'low',  time:'2026-08-07 11:40:21', msg:'電表功耗異常升高', station:'廠務監控', machine:'—',         value:'52 kW（上限 50）', status:'open', ackBy:null, ackNote:'' },
  ];

  let newAlerts = new Set();

  function renderAlerts() {
    const sev     = document.getElementById('fSeverity').value;
    const station = document.getElementById('fStation').value;
    const status  = document.getElementById('fStatus').value;
    const user    = getSession();

    let list = ALERTS;
    if (sev)     list = list.filter(a => a.sev === sev);
    if (station) list = list.filter(a => a.station === station);
    if (status)  list = list.filter(a => a.status === status);

    const canAck = user && (user.role === 'Admin' || user.role === 'Operator');

    document.getElementById('alertTbody').innerHTML = list.map(a => `
      <tr class="alert-row ${newAlerts.has(a.id) ? 'new-alert' : ''}">
        <td class="severity-${a.sev}">${a.sev === 'high' ? '● 高' : '○ 低'}</td>
        <td style="font-size:12px;color:var(--text-muted);white-space:nowrap;">${a.time}</td>
        <td>${a.msg}</td>
        <td>${a.station}</td>
        <td style="font-size:12px;color:var(--text-muted);">${a.machine}</td>
        <td style="font-size:12px;">${a.value}</td>
        <td>
          ${a.status === 'ack'
            ? `<span class="ack-chip">✓ 已處理</span><br><span style="font-size:11px;color:var(--text-muted);">${a.ackBy}</span>`
            : '<span class="badge badge-warning">未處理</span>'}
        </td>
        <td>
          ${a.status === 'open' && canAck
            ? `<button class="btn btn-ghost" style="padding:5px 10px;font-size:12px;" onclick="openAck('${a.id}')">Acknowledge</button>`
            : ''}
        </td>
      </tr>
    `).join('') || '<tr><td colspan="8"><div class="empty-state">無符合條件的告警</div></td></tr>';
  }

  function openAck(id) {
    const a = ALERTS.find(x => x.id === id);
    openModal('處理告警', `
      <div style="margin-bottom:14px;">
        <div class="info-row">
          <div class="info-item"><div class="info-label">告警訊息</div><div class="info-value">${a.msg}</div></div>
          <div class="info-item"><div class="info-label">站點 / 機台</div><div class="info-value">${a.station} / ${a.machine}</div></div>
        </div>
      </div>
      <div class="form-group">
        <label>處理備註</label>
        <textarea id="ackNote" rows="3" style="width:100%;border:1.5px solid var(--border);border-radius:var(--radius);padding:10px;font:inherit;resize:vertical;outline:none;" placeholder="說明處理方式..."></textarea>
      </div>
    `, () => {
      const user = getSession();
      a.status  = 'ack';
      a.ackBy   = user.name;
      a.ackNote = document.getElementById('ackNote').value;
      closeModal();
      renderAlerts();
    });
  }

  renderAlerts();

  // Simulate live alerts every 12 seconds
  const LIVE_MSGS = [
    { sev:'low',  msg:'傳送帶速度波動', station:'回流焊', machine:'回焊爐-02', value:'55 cm/min（正常 60）' },
    { sev:'high', msg:'回流區溫度超標', station:'回流焊', machine:'回焊爐-01', value:'261.5 °C（上限 260）' },
    { sev:'low',  msg:'站區溫度偏高',   station:'廠務監控', machine:'—',       value:'29°C（上限 28）' },
  ];
  let liveIdx = 0;
  setInterval(() => {
    if (Math.random() > 0.5) return;
    const tmpl = LIVE_MSGS[liveIdx % LIVE_MSGS.length]; liveIdx++;
    const now = new Date();
    const timeStr = now.getFullYear()+'-'+(now.getMonth()+1).toString().padStart(2,'0')+'-'+now.getDate().toString().padStart(2,'0')+' '+
      now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0')+':'+now.getSeconds().toString().padStart(2,'0');
    const newId = 'A' + (ALERTS.length+1).toString().padStart(3,'0');
    const newA = { id:newId, ...tmpl, time:timeStr, status:'open', ackBy:null, ackNote:'' };
    ALERTS.unshift(newA);
    newAlerts.add(newId);
    setTimeout(() => { newAlerts.delete(newId); }, 2000);
    renderAlerts();
  }, 12000);
</script>
</body>
</html>
