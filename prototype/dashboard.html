<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>willThx — Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="sidebarMount"></div>

<div class="main">
  <header class="page-header">
    <div>
      <div class="page-title">Dashboard</div>
      <div class="page-subtitle">即時監控</div>
    </div>
    <div class="header-actions">
      <span id="clockDisplay" style="font-size:13px;color:var(--text-muted);"></span>
    </div>
  </header>

  <div class="page-body">

    <!-- Station Status Bar -->
    <div class="station-bar" id="stationBar">
      <div class="station-pill active"    data-station="s1" onclick="selectStation('s1')">
        <span class="dot dot-done"></span> 錫膏印刷
      </div>
      <div class="station-pill"           data-station="s2" onclick="selectStation('s2')">
        <span class="dot dot-done"></span> AOI 檢測
      </div>
      <div class="station-pill error"     data-station="s3" onclick="selectStation('s3')">
        <span class="dot" style="background:var(--danger)"></span> 回流焊
      </div>
      <div class="station-pill"           data-station="s4" onclick="selectStation('s4')">
        <span class="dot dot-done"></span> 最終組裝
      </div>
    </div>

    <!-- Stat Cards -->
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">在線機台</div>
        <div class="stat-value">7 <span style="font-size:14px;color:var(--text-muted)">/ 8</span></div>
        <div class="stat-sub">1 台異常</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">當前批號</div>
        <div class="stat-value">Lot-007</div>
        <div class="stat-sub">進行中</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">批號進度</div>
        <div class="stat-value">14 <span style="font-size:14px;color:var(--text-muted)">/ 20</span></div>
        <div class="stat-sub">Unit 完成數</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">今日告警</div>
        <div class="stat-value" style="color:var(--danger)">3</div>
        <div class="stat-sub">2 高 / 1 低</div>
      </div>
    </div>

    <!-- Main Grid -->
    <div class="grid-2" style="gap:20px; align-items:start;">

      <!-- Telemetry Panel -->
      <div class="card">
        <div class="card-header">
          <span class="card-title" id="telemetryTitle">錫膏印刷 — 即時感測數值</span>
          <div class="card-actions">
            <select id="timeWindow" style="width:auto;padding:5px 10px;font-size:12px;" onchange="refreshChart()">
              <option value="30">近 5 分鐘</option>
              <option value="90">近 15 分鐘</option>
              <option value="180">近 30 分鐘</option>
            </select>
          </div>
        </div>
        <div class="card-body" style="padding-bottom:12px;">
          <canvas id="telemetryChart" width="560" height="220" style="width:100%;height:auto;"></canvas>
          <div id="chartLegend" style="display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;"></div>
        </div>
      </div>

      <!-- Alert List -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">即時告警</span>
          <div class="card-actions">
            <a href="alerts-live.html" class="btn btn-ghost" style="padding:5px 12px;font-size:12px;">查看全部</a>
          </div>
        </div>
        <div class="card-body">
          <div class="alert-list" id="alertList"></div>
        </div>
      </div>

    </div>

    <!-- Lot Progress -->
    <div class="card" style="margin-top:20px;">
      <div class="card-header">
        <span class="card-title">當前批號進度</span>
      </div>
      <div class="card-body" style="display:flex;flex-direction:column;gap:10px;" id="lotProgress">
      </div>
    </div>

  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  // ===== Init =====
  document.getElementById('sidebarMount').innerHTML = renderSidebar();
  initApp();

  // ===== Clock =====
  function updateClock() {
    const now = new Date();
    document.getElementById('clockDisplay').textContent =
      now.toLocaleString('zh-TW', { hour12: false });
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ===== Station Data Config =====
  const STATIONS = {
    s1: {
      label: '錫膏印刷',
      metrics: [
        { name: '刮刀壓力 (kgf)', color: '#2563eb', base: 2.1, noise: 0.3 },
        { name: '印刷厚度 (mm)',  color: '#10b981', base: 0.15, noise: 0.02 },
      ]
    },
    s2: {
      label: 'AOI 檢測',
      metrics: [
        { name: 'Pass 率 (%)', color: '#2563eb', base: 96, noise: 3 },
      ]
    },
    s3: {
      label: '回流焊',
      metrics: [
        { name: '預熱區溫度 (°C)',  color: '#f59e0b', base: 150, noise: 5 },
        { name: '回流區溫度 (°C)',  color: '#ef4444', base: 245, noise: 8 },
        { name: '冷卻區溫度 (°C)',  color: '#2563eb', base: 80,  noise: 4 },
        { name: '傳送速度 (cm/min)', color: '#10b981', base: 60, noise: 2 },
      ]
    },
    s4: {
      label: '最終組裝',
      metrics: [
        { name: '鎖點扭力 (N·m)', color: '#2563eb', base: 1.2, noise: 0.15 },
      ]
    },
  };

  let currentStation = 's1';
  const N = 30;

  function selectStation(id) {
    currentStation = id;
    document.querySelectorAll('.station-pill').forEach(el => {
      el.classList.toggle('active', el.dataset.station === id);
    });
    refreshChart();
  }

  function refreshChart() {
    const n = parseInt(document.getElementById('timeWindow').value);
    const s = STATIONS[currentStation];
    const labels = timeLabels(n);
    const datasets = s.metrics.map(m => ({
      data: randomWalk(m.base, m.noise, n),
      color: m.color,
      name: m.name,
    }));

    const canvas = document.getElementById('telemetryChart');
    canvas.width = canvas.offsetWidth || 560;
    drawLineChart(canvas, datasets, labels);

    document.getElementById('telemetryTitle').textContent = `${s.label} — 即時感測數值`;

    // Legend
    const legend = document.getElementById('chartLegend');
    legend.innerHTML = datasets.map(d =>
      `<span style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-muted)">
        <span style="width:14px;height:3px;background:${d.color};border-radius:2px;display:inline-block;"></span>
        ${d.name}
      </span>`
    ).join('');
  }

  // ===== Alert List (mock) =====
  const MOCK_ALERTS = [
    { sev: 'high', msg: '回流焊 回流區溫度超標 +4.2°C', time: '13:47', station: '回流焊' },
    { sev: 'high', msg: 'AOI 連續 3 片 fail（錫橋缺陷）', time: '13:31', station: 'AOI 檢測' },
    { sev: 'low',  msg: '站區濕度偏高 (68% / 上限 65%)', time: '13:18', station: '廠務' },
  ];

  function renderAlerts() {
    document.getElementById('alertList').innerHTML = MOCK_ALERTS.map(a => `
      <div class="alert-item ${a.sev}">
        <div class="alert-meta">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px;">
            <span class="alert-sev">${a.sev === 'high' ? '● 高' : '○ 低'}</span>
            <span style="font-size:12px;color:var(--text-muted)">${a.station}</span>
          </div>
          <div class="alert-msg">${a.msg}</div>
        </div>
        <div class="alert-time">${a.time}</div>
      </div>
    `).join('');
  }

  // ===== Lot Progress =====
  const MOCK_LOTS = [
    { id: 'Lot-007', done: 14, total: 20, stations: ['done','done','partial','pending'] },
    { id: 'Lot-006', done: 20, total: 20, stations: ['done','done','done','done'] },
  ];

  const STATION_LABELS = ['錫膏', 'AOI', '回流焊', '組裝'];

  function renderLots() {
    document.getElementById('lotProgress').innerHTML = MOCK_LOTS.map(l => `
      <div class="lot-progress">
        <div class="lot-id">${l.id}</div>
        <div class="lot-count">${l.done} / ${l.total} Unit</div>
        <div class="lot-stations">
          ${l.stations.map((s, i) => `
            <div class="lot-station-dot">
              <span class="dot dot-${s}"></span>
              <span>${STATION_LABELS[i]}</span>
            </div>
          `).join('')}
        </div>
        <div style="margin-left:12px;">
          ${l.done === l.total
            ? '<span class="badge badge-success">完成</span>'
            : '<span class="badge badge-info">進行中</span>'}
        </div>
      </div>
    `).join('');
  }

  // ===== Initial Render =====
  refreshChart();
  renderAlerts();
  renderLots();

  // Simulate live update every 5 seconds
  setInterval(() => {
    refreshChart();
    // Simulate new alert occasionally
    if (Math.random() < 0.15) {
      MOCK_ALERTS.unshift({
        sev: Math.random() < 0.4 ? 'high' : 'low',
        msg: '回流焊 傳送速度異常波動',
        time: new Date().toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit', hour12:false }),
        station: '回流焊',
      });
      if (MOCK_ALERTS.length > 5) MOCK_ALERTS.pop();
      renderAlerts();
    }
  }, 5000);
</script>

</body>
</html>
