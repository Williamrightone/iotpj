<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>willThx — 告警規則設定</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="sidebarMount"></div>
<div class="main">
  <header class="page-header">
    <div>
      <div class="page-title">告警規則設定</div>
      <div class="page-subtitle">告警中心 / 告警規則設定</div>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary" data-admin-only onclick="openAddRule()">＋ 新增規則</button>
    </div>
  </header>
  <div class="page-body">
    <div class="card">
      <div class="card-body" style="padding:0;">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>啟用</th>
                <th>IoT 元件</th>
                <th>觸發條件</th>
                <th>嚴重度</th>
                <th>通知方式</th>
                <th data-admin-only>操作</th>
              </tr>
            </thead>
            <tbody id="rulesTbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="modalMount"></div>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById('sidebarMount').innerHTML = renderSidebar();
  document.getElementById('modalMount').innerHTML = MODAL_HTML;
  initApp();

  const NOTIFY_LABELS = {
    'dashboard':           '僅 Dashboard',
    'dashboard,telegram':  'Dashboard + Telegram',
  };

  function renderTable() {
    const user = getSession();
    document.getElementById('rulesTbody').innerHTML = MOCK_RULES.map(r => `
      <tr>
        <td>
          <label class="toggle">
            <input type="checkbox" ${r.active?'checked':''} onchange="toggleRule('${r.id}',this.checked)" ${user&&user.role!=='Admin'?'disabled':''}>
            <span class="toggle-slider"></span>
          </label>
        </td>
        <td><strong>${r.component}</strong></td>
        <td><code style="font-size:12px;background:var(--bg);padding:2px 8px;border-radius:4px;">${r.condition} ${r.unit}</code></td>
        <td class="severity-${r.sev}">${r.sev==='high'?'● 高':'○ 低'}</td>
        <td><span class="badge badge-info" style="font-size:11px;">${NOTIFY_LABELS[r.notify]||r.notify}</span></td>
        <td data-admin-only style="display:flex;gap:6px;">
          <button class="btn btn-ghost" style="padding:5px 12px;font-size:12px;" onclick="openEditRule('${r.id}')">編輯</button>
          <button class="btn btn-ghost" style="padding:5px 12px;font-size:12px;color:var(--danger);" onclick="deleteRule('${r.id}')">刪除</button>
        </td>
      </tr>
    `).join('');
  }

  function toggleRule(id, active) {
    const r = MOCK_RULES.find(x => x.id === id);
    if (r) r.active = active;
  }

  function ruleForm(r = {}) {
    const compOptions = MOCK_COMPONENTS
      .filter(c => c.type === 'Telemetry')
      .map(c => {
        const allM = Object.values(MOCK_MACHINES).flat();
        const m = allM.find(x => x.id === c.machineId);
        const label = m ? `${c.name} (${m.name})` : c.name;
        const selected = r.component === label ? 'selected' : '';
        return `<option value="${label}" ${selected}>${label}</option>`;
      }).join('');

    return `
      <div class="form-group">
        <label>IoT 元件（僅顯示 Telemetry 類型）</label>
        <select id="fComp">${compOptions}</select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>觸發條件</label>
          <select id="fOp">
            <option ${ r.condition && r.condition.startsWith('>')  ?'selected':''} value=">">&gt; 大於</option>
            <option ${ r.condition && r.condition.startsWith('<')  ?'selected':''} value="<">&lt; 小於</option>
          </select>
        </div>
        <div class="form-group">
          <label>閾值</label>
          <input id="fThreshold" type="number" step="any" value="${r.condition ? r.condition.replace(/[><]/,'').trim() : ''}">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>嚴重度</label>
          <select id="fSev">
            <option value="high" ${r.sev==='high'?'selected':''}>高</option>
            <option value="low"  ${r.sev==='low' ?'selected':''}>低</option>
          </select>
        </div>
        <div class="form-group">
          <label>通知方式</label>
          <select id="fNotify">
            <option value="dashboard"          ${r.notify==='dashboard'         ?'selected':''}>僅 Dashboard</option>
            <option value="dashboard,telegram" ${r.notify==='dashboard,telegram'?'selected':''}>Dashboard + Telegram</option>
          </select>
        </div>
      </div>`;
  }

  function openAddRule() {
    openModal('新增告警規則', ruleForm(), () => {
      const op  = document.getElementById('fOp').value;
      const thr = document.getElementById('fThreshold').value;
      if (!thr) return alert('請填寫閾值');
      const comp = document.getElementById('fComp');
      const unit = (() => {
        const name = comp.options[comp.selectedIndex].text;
        const found = MOCK_COMPONENTS.find(c => c.name === name.split(' (')[0]);
        return found ? found.unit : '';
      })();
      MOCK_RULES.push({
        id: 'R' + (MOCK_RULES.length+1).toString().padStart(2,'0'),
        component: comp.value,
        condition: `${op} ${thr}`,
        unit,
        sev:    document.getElementById('fSev').value,
        notify: document.getElementById('fNotify').value,
        active: true,
      });
      renderTable(); closeModal();
    });
  }

  function openEditRule(id) {
    const r = MOCK_RULES.find(x => x.id === id);
    openModal('編輯告警規則', ruleForm(r), () => {
      const op  = document.getElementById('fOp').value;
      const thr = document.getElementById('fThreshold').value;
      if (!thr) return alert('請填寫閾值');
      r.component = document.getElementById('fComp').value;
      r.condition = `${op} ${thr}`;
      r.sev       = document.getElementById('fSev').value;
      r.notify    = document.getElementById('fNotify').value;
      renderTable(); closeModal();
    });
  }

  function deleteRule(id) {
    if (!confirm('確定刪除此規則？')) return;
    const i = MOCK_RULES.findIndex(x => x.id === id);
    if (i > -1) MOCK_RULES.splice(i, 1);
    renderTable();
  }

  renderTable();
</script>
</body>
</html>
