<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>willThx — 登入</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-logo">
      <div class="brand">willThx</div>
      <div class="tagline">IoT 製造監控平台</div>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">帳號</label>
        <input type="text" id="username" placeholder="請輸入帳號" autocomplete="username" autofocus>
      </div>
      <div class="form-group">
        <label for="password">密碼</label>
        <input type="password" id="password" placeholder="請輸入密碼" autocomplete="current-password">
      </div>
      <div class="form-error" id="errorMsg"></div>
      <button type="submit" class="btn-login">登入</button>
    </form>

    <div class="login-hint">
      <strong>Demo 帳號</strong><br>
      admin / admin123 &nbsp;·&nbsp; Admin 角色<br>
      maintainer / mt123 &nbsp;·&nbsp; Maintainer 角色<br>
      viewer / view123 &nbsp;&nbsp;·&nbsp; Viewer 角色
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
