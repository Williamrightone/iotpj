server:
  port: 8090

spring:
  application:
    name: saas-bff

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

# Feign
uaa:
  service:
    url: ${UAA_SERVICE_URL:http://localhost:8081}

iotcore:
  service:
    url: ${IOTCORE_SERVICE_URL:http://localhost:8082}

# JWT RS256（僅公鑰，用於驗簽）
jwt:
  public-key: ${JWT_PUBLIC_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.willthx: INFO
