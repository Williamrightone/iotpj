server:
  port: 8081

spring:
  application:
    name: uaa-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:uaa_db}?allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:willthx}
    password: ${DB_PASSWORD:willthx123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

# Snowflake ID 生成器（Worker ID，Kubernetes 環境由 env 注入）
snowflake:
  worker-id: ${SNOWFLAKE_WORKER_ID:1}

# JWT RS256 設定
# 金鑰格式：Base64 編碼的 DER 位元組（PKCS8 私鑰 / X.509 公鑰）
# 正式環境請透過環境變數 JWT_PRIVATE_KEY / JWT_PUBLIC_KEY 注入，勿在此填入正式金鑰
jwt:
  private-key: ${JWT_PRIVATE_KEY:}
  public-key:  ${JWT_PUBLIC_KEY:}
  access-token-expiry-seconds:  ${JWT_ACCESS_EXPIRY:900}     # 15 分鐘
  refresh-token-expiry-seconds: ${JWT_REFRESH_EXPIRY:604800} # 7 天

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.willthx: INFO
