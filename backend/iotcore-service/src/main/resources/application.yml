server:
  port: 8082

spring:
  application:
    name: iotcore-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:iotcore_db}?allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:willthx}
    password: ${DB_PASSWORD:willthx123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Snowflake ID 生成器（Worker ID，Kubernetes 環境由 env 注入）
snowflake:
  worker-id: ${SNOWFLAKE_WORKER_ID:2}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.willthx: INFO
